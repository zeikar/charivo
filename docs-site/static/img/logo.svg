<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="charivoBg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square base -->
  <rect width="64" height="64" rx="15" fill="url(#charivoBg)"/>

  <!-- Ears. Drawn before the head so their bases tuck under it, and stroked in
       their own fill colour so the tips round off -- a bare triangle reads as a
       horn once the icon is down at 16px. -->
  <path d="M 17.5 14 L 14.5 25 L 29.5 20.5 Z" fill="#FFF7ED" stroke="#FFF7ED" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 46.5 14 L 49.5 25 L 34.5 20.5 Z" fill="#FFF7ED" stroke="#FFF7ED" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 19.5 17.5 L 17.6 23.8 L 26.5 21 Z" fill="#FBCFB4" stroke="#FBCFB4" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 44.5 17.5 L 46.4 23.8 L 37.5 21 Z" fill="#FBCFB4" stroke="#FBCFB4" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Speech-bubble tail. This is the whole idea: the head is a chat bubble, so
       the mark says "character that talks" in one silhouette. -->
  <path d="M 23 43.5 L 19 52 L 30.5 46 Z" fill="#FFF7ED" stroke="#FFF7ED" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Head / bubble body -->
  <rect x="11.5" y="18" width="41" height="29" rx="13" fill="#FFF7ED"/>

  <!-- Eyes carry the whole face. There is deliberately no mouth, blush or
       sparkle: every extra shape is the first thing to turn to mush at 16px. -->
  <circle cx="25" cy="32.5" r="4" fill="#1E293B"/>
  <circle cx="39" cy="32.5" r="4" fill="#1E293B"/>
  <circle cx="23.6" cy="30.8" r="1.55" fill="#FFFFFF"/>
  <circle cx="37.6" cy="30.8" r="1.55" fill="#FFFFFF"/>
</svg>
