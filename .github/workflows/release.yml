name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No `version:` — action-setup reads the root packageManager pin, so a
      # bump there moves local and CI together.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm 11.5.1+; the runner's Node 22 ships
      # npm 10. Every @charivo package is registered as trusting this workflow
      # (`npm trust list <pkg>`), so releases publish over OIDC and carry SLSA
      # provenance — check with `npm view <pkg> dist.attestations`.
      #
      # NODE_AUTH_TOKEN IS still passed below, and the two coexist: npm prefers
      # OIDC for any package that has a trust config and falls back to the token
      # only for one that does not — a package being published for the first
      # time, before anyone has run `npm trust` against it.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release:ci
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
